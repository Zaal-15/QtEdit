name: Build AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    # Ubuntu 22.04 provides glibc 2.35 and Qt 6.2, producing an AppImage
    # that also runs on Debian 12, Ubuntu 22.04+, Fedora 36+ and newer.
    runs-on: ubuntu-22.04

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake qt6-base-dev libgl1-mesa-dev \
            file binutils curl

      - name: Build the AppImage
        run: ./packaging/build-appimage.sh

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: QtEdit-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: appimage
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download the built AppImage
        uses: actions/download-artifact@v4
        with:
          name: QtEdit-AppImage
          path: dist

      - name: Attach it to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
